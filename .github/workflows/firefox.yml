name: Firefox Webapps
on:
  push:
    branches: ['fix/firefox-*']
  pull_request:
    paths:
      - 'src/paimenos/browser.py'
      - 'src/paimenos/webapp.py'
      - 'src/paimenos/i18n.py'
      - 'installer/language.sh'
      - 'iso/setup-after-install.sh'
      - 'iso/prepare-apt.py'
      - 'assets/i18n/**'
      - 'src/paimenos/close_overlay.py'
      - 'src/paimenos/menu*.py'
      - 'src/paimenos/lockscreen.py'
      - 'src/paimenos/timer.py'
      - 'src/paimenos/status_overlay.py'
      - 'src/paimenos/screen_guard.py'
      - 'src/paimenos/foreground.py'
      - 'tests/test_browser.py'
      - 'tests/test_firefox_integration.py'
      - 'tests/test_screen_guard.py'
      - 'tests/test_i18n.py'
      - 'tests/test_iso_setup.py'
      - 'tests/test_iso_apt.py'
      - '.github/workflows/iso.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/firefox.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firefox:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        debian: [bookworm, trixie]
    container: debian:${{ matrix.debian }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Firefox and X11 test dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3 python3-xlib python3-flask python3-pyqt5 qttranslations5-l10n firefox-esr xvfb xauth openbox
          useradd -m -s /bin/sh webtest
      - name: Profile and lifecycle tests
        run: python3 -B -m unittest discover -s tests -p test_browser.py -v
      - name: German and English locale and ISO setup tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python3 -B -m unittest discover -s tests -p test_i18n.py -v
          python3 -B -m unittest discover -s tests -p test_iso_setup.py -v
          python3 -B -m unittest discover -s tests -p test_iso_apt.py -v
      - name: Real APT download with ISO session configuration
        run: |
          apt_session=$(mktemp)
          trap 'rm -f "$apt_session"' EXIT
          python3 -B - "$apt_session" <<'PY'
          import importlib.util
          import os
          from pathlib import Path
          import sys
          spec = importlib.util.spec_from_file_location('iso_apt', 'iso/prepare-apt.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module.session_config(Path(sys.argv[1]), previous_config=os.environ.get('APT_CONFIG'))
          PY
          APT_CONFIG="$apt_session" apt-get update
      - name: Screen-time and parent-view regression tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 -B -m unittest discover -s tests -p test_screen_guard.py -v
      - name: Real Openbox window stacking and screen-time input tests
        env:
          QT_QPA_PLATFORM: xcb
          PAIMENOS_SCREEN_GUARD_INTEGRATION: '1'
        run: |
          xvfb-run -a sh -c 'openbox --config-file config/openbox/rc.xml > /tmp/openbox-guard.log 2>&1 & python3 -B -m unittest discover -s tests -p test_screen_guard.py -v'
      - name: Real Firefox cache and restart tests
        env:
          PAIMENOS_FIREFOX_INTEGRATION: '1'
          MOZ_DISABLE_CONTENT_SANDBOX: '1'
        run: |
          runuser -u webtest -- mkdir -p /home/webtest/.config/paimenos
          runuser -u webtest -- python3 tools/initialize-settings.py /home/webtest/.config/paimenos/settings.json 1234
          runuser -u webtest -- env HOME=/home/webtest xvfb-run -a sh -c 'openbox > /tmp/openbox.log 2>&1 & python3 -B -m unittest discover -s tests -p test_firefox_integration.py -v'
