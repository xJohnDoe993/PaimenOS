name: Build PaimenOS ISO

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paimenos-iso-${{ github.ref }}
  cancel-in-progress: false

jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Quellcode laden
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: ISO in Debian 13 bauen
        shell: bash
        env:
          # Optional: privater Signaturschlüssel (ASCII-armored) für die Offline-Paketquelle.
          # Ohne Secret signiert der Build mit einem Einmalschlüssel.
          PAIMENOS_REPO_SIGNING_KEY: ${{ secrets.PAIMENOS_REPO_SIGNING_KEY }}
        run: |
          set -o pipefail
          mkdir -p dist/iso
          docker run --rm --privileged -e PAIMENOS_REPO_SIGNING_KEY \
            --mount type=bind,src="$GITHUB_WORKSPACE",dst=/source \
            --workdir /source debian:trixie \
            bash -Eeuo pipefail -c '
              apt-get update
              apt-get install -y --no-install-recommends python3 python3-flask python3-pyqt5 python3-pyqt5.qtmultimedia qttranslations5-l10n python3-xlib libqt5multimedia5-plugins live-build debootstrap git ca-certificates xorriso squashfs-tools gnupg apt-utils grub-pc-bin grub-efi-amd64-bin mtools dosfstools
              git config --global --add safe.directory /source
              QT_QPA_PLATFORM=offscreen python3 -B tools/check.py
              bash iso/build.sh
            ' 2>&1 | tee dist/iso/build.log
      - name: ISO und Prüfsumme bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: PaimenOS-ISO-amd64
          path: |
            dist/iso/*.iso
            dist/iso/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Buildprotokoll bereitstellen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PaimenOS-ISO-build-log
          path: dist/iso/build.log
          if-no-files-found: warn
          retention-days: 7
