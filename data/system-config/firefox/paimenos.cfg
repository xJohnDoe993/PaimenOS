// PaimenOS Firefox-Autoconfig. Die erste Zeile muss ein Kommentar sein.
// Entfernt Tastenkürzel für neue Tabs/Fenster aus den Browserfenstern der Kinder. Die Tab-Leiste ist
// ausgeblendet, ein neuer Tab wäre dort unsichtbar. Der Eltern-Browser (Profil "parent-area") bleibt unverändert.
try {
  let profile = '';
  try { profile = Services.dirsvc.get('ProfD', Ci.nsIFile).leafName; } catch (e) {}
  if (profile !== 'parent-area') {
    const KEYS = ['key_newNavigatorTab', 'key_newNavigator', 'key_undoCloseTab', 'key_undoCloseWindow',
                  'key_privatebrowsing', 'key_openFile'];
    Services.obs.addObserver({
      observe(window) {
        for (const id of KEYS) {
          const key = window.document.getElementById(id);
          if (key) key.remove();
        }
      },
    }, 'browser-delayed-startup-finished');
  }
} catch (e) {}
