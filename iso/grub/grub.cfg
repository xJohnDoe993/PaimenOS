# PaimenOS-Bootmenü (BIOS und UEFI). Ersetzt die Vorlage von live-build:
# kein Failsafe, kein Memtest, kein Debian-Installer.
source /boot/grub/config.cfg

# Beide Einträge starten das Live-System. "installieren" setzt paimenos.install:
# Das Live-Menü (iso/live-menu.sh) öffnet dann direkt den PaimenOS-Installer.
menuentry 'PaimenOS installieren' --hotkey=i {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ paimenos.install
	initrd	@INITRD_LIVE@
}

menuentry 'PaimenOS Live-System testen' --hotkey=l {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@
	initrd	@INITRD_LIVE@
}

if [ "${grub_platform}" = "efi" ]; then
	menuentry 'UEFI-Firmware-Einstellungen' --hotkey=f {
		fwsetup
	}
fi
