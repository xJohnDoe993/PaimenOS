# PaimenOS-Bootmenü (BIOS und UEFI). Ersetzt die Vorlage von live-build:
# kein Failsafe, kein Memtest, keine Expert-/Rescue-/Dark-Theme-/Sprachausgabe-Varianten.
source /boot/grub/config.cfg

# Live-System (startet das Live-Menü auf tty1)
menuentry 'PaimenOS Live-System starten' --hotkey=l {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@
	initrd	@INITRD_LIVE@
}

menuentry 'PaimenOS installieren (grafisch)' --hotkey=i {
	linux	@KERNEL_GI@ vga=788 @APPEND_INSTALL@ --- quiet
	initrd	@INITRD_GI@
}

menuentry 'PaimenOS installieren (Text)' --hotkey=t {
	linux	@KERNEL_DI@ vga=788 @APPEND_INSTALL@ --- quiet
	initrd	@INITRD_DI@
}

if [ "${grub_platform}" = "efi" ]; then
	menuentry 'UEFI-Firmware-Einstellungen' --hotkey=f {
		fwsetup
	}
fi
